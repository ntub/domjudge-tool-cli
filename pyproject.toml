[project]
name = "domjudge-tool-cli"
version = "0.4.0"
description = "A simple domjudge tool on cli."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
    {name = "ntub-inc"},
]
dependencies = [
    "aiofiles>=25.1.0,<26",
    "beautifulsoup4>=4.15.0,<5",
    "httpx>=0.28.1,<0.29",
    "pydantic[email]>=2.13.5,<3",
    "tablib>=3.10.0,<4",
    "typer>=0.27.2,<0.28",
]

[project.urls]
repository = "https://github.com/ntub/domjudge-tool-cli"

[project.scripts]
domjudge-tool-cli = "domjudge_tool_cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff==0.16.6",
    "ty==0.0.80",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "domjudge_tool_cli"
module-root = ""
source-include = ["tests/**"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["domjudge_tool_cli"]

[tool.ty.src]
include = ["domjudge_tool_cli", "tests"]

[tool.ty.environment]
root = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
