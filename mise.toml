min_version = "2026.9.4"

[tools]
python = "3.13.15"
uv = "0.12.12"

[env]
UV_PYTHON = { value = "{{ tools.python.path }}", tools = true }

[settings]
lockfile = true
minimum_release_age = "0"

[tasks.install]
run = "uv sync --locked"

[tasks.format]
run = "uv run --locked ruff check --fix . && uv run --locked ruff format ."

[tasks."format-check"]
run = "uv run --locked ruff format --check ."

[tasks.lint]
run = "uv run --locked ruff check ."

[tasks.typecheck]
run = "uv run --locked ty check"

[tasks.test]
run = "uv run --locked pytest"

[tasks.build]
run = "uv build"

[tasks.check]
depends = ["format-check", "lint", "typecheck", "test"]
depends_post = []
wait_for = []
